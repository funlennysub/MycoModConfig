[config]
schemaVersion = "0.0.1"

[package]
namespace = "funlennysub"
name = "MycoModConfig"
description = "Adds a Mods tab to the settings menu with every mod's config."
websiteUrl = "https://github.com/funlennysub/MycoModConfig"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"
funlennysub-MycoMenuLib = "0.1.0"
MonoDetour-MonoDetour_BepInEx_5 = "0.7.1801"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/dev.funlennysub.MycoModConfig.dll"
target = "BepInEx/plugins/dev.funlennysub.MycoModConfig.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "client", "qol" ]
