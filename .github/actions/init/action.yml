name: 'Init stuff'
description: 'Initialize build environment'

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "9.x"
        
    - name: Restore
      shell: bash
      run: dotnet restore
      
    - name: Install tcli
      shell: bash
      run: | 
        dotnet tool install -g tcli
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH